# Entwicklungsumgebung. Start mit:  docker compose up
# Produktionsbetrieb erfordert eine eigene Compose-Datei (Secrets, TLS, Backups) -
# offener Freigabepunkt, siehe docs/security.md, Abschnitt 8.
#
# Netz (Sicherheitsauftrag 2026-10-10): Alle veroeffentlichten Ports sind
# ausdruecklich an 127.0.0.1 gebunden - erreichbar nur von diesem Rechner, nicht
# aus dem lokalen Netz. Die Dienste sprechen untereinander ueber das interne
# Compose-Netz (postgres:5432, minio:9000); daran aendert die Bindung nichts.
#
# Secrets und Einstellungen: Docker Compose liest `.env` im Projektverzeichnis
# (Vorlage: .env.example) und setzt die unten mit ${...} referenzierten Werte
# ein. Nur diese erreichen die Container - eine Variable, die hier nicht
# genannt ist, kommt im Backend-Container NICHT an. Alle Standardwerte sind
# reine ENTWICKLUNGSWERTE; in Produktion verweigert das Backend den Start mit
# ihnen (app/config.py).
#
# Datenbank-Zugangsdaten bleiben bewusst fest: Das Kennwort wird nur beim
# allerersten Anlegen des Volumes gesetzt. Ein geaenderter Wert hier wuerde ein
# bestehendes Volume nicht aendern, sondern das Backend aussperren.
#
# Images sind auf Digests gepinnt (Punkt 1 der Phase-1.1-Abnahme). Ein Update
# erfolgt bewusst durch Austausch des Digests, nicht durch einen beweglichen Tag.
# MinIO wird von quay.io bezogen - auf Docker Hub existiert `minio/minio` nicht mehr.

services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    container_name: elektroplan-postgres
    environment:
      POSTGRES_USER: elektroplan
      POSTGRES_PASSWORD: elektroplan
      POSTGRES_DB: elektroplan
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h/-p erzwingen eine echte TCP-Verbindung; waehrend der Initialisierung
      # startet PostgreSQL kurzzeitig nur auf dem Unix-Socket.
      test: ["CMD-SHELL", "pg_isready -U elektroplan -d elektroplan -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: elektroplan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: elektroplan
      # Entwicklungswert. Gleicher Wert wie ELEKTROPLAN_S3_SECRET_KEY des
      # Backends. Bei einem bestehenden Volume nur bewusst aendern.
      MINIO_ROOT_PASSWORD: ${ELEKTROPLAN_S3_SECRET_KEY:-elektroplan-dev-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Dokumentierter Liveness-Endpunkt, im Image liegt curl unter /usr/bin/curl.
      # Bewusst ohne `mc`-Alias: Der Healthcheck darf von nichts abhaengen, das
      # erst ein nachgelagerter Container anlegt.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: elektroplan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/elektroplan
        mc anonymous set none local/elektroplan
        echo "Bucket 'elektroplan' bereit, anonymer Zugriff deaktiviert."
    environment:
      MINIO_ROOT_USER: elektroplan
      MINIO_ROOT_PASSWORD: ${ELEKTROPLAN_S3_SECRET_KEY:-elektroplan-dev-secret}
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    container_name: elektroplan-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ELEKTROPLAN_ENVIRONMENT: development
      ELEKTROPLAN_DEBUG: "true"
      ELEKTROPLAN_DATABASE_URL: postgresql+psycopg://elektroplan:elektroplan@postgres:5432/elektroplan
      # JWT-Signaturschluessel aus .env. Leer = Entwicklungsersatzwert des
      # Backends (beim Start als Warnung protokolliert, in Produktion verboten).
      ELEKTROPLAN_JWT_SECRET: ${ELEKTROPLAN_JWT_SECRET:-}
      ELEKTROPLAN_JWT_KEY_ID: ${ELEKTROPLAN_JWT_KEY_ID:-key-1}
      # Interner Endpunkt: Backend -> MinIO im Docker-Netz.
      ELEKTROPLAN_S3_ENDPOINT_URL: http://minio:9000
      # Oeffentlicher Endpunkt: signierte URLs, die der Browser aufruft.
      # Muss vom Host aus aufloesbar sein - "minio" ist es nicht.
      ELEKTROPLAN_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      ELEKTROPLAN_S3_ACCESS_KEY: elektroplan
      ELEKTROPLAN_S3_SECRET_KEY: ${ELEKTROPLAN_S3_SECRET_KEY:-elektroplan-dev-secret}
      ELEKTROPLAN_S3_BUCKET: elektroplan
      ELEKTROPLAN_CORS_ORIGINS: http://localhost:5173
      # Startbestand (nur Entwicklung): Werte aus .env, sonst Entwicklungswerte.
      # Wirkt nur beim Anlegen durch `python -m app.cli seed`; ein bestehendes
      # Konto behaelt sein Passwort.
      ELEKTROPLAN_SEED_ORG_NAME: ${ELEKTROPLAN_SEED_ORG_NAME:-Elektro Musterbetrieb GmbH}
      ELEKTROPLAN_SEED_ADMIN_EMAIL: ${ELEKTROPLAN_SEED_ADMIN_EMAIL:-admin@example.com}
      ELEKTROPLAN_SEED_ADMIN_PASSWORD: ${ELEKTROPLAN_SEED_ADMIN_PASSWORD:-entwicklung-bitte-aendern}
      # Einladungen (Phase 4.2): Es gibt noch keinen E-Mail-Versand. In der
      # Entwicklung erscheint der Einladungslink einmalig in der Oberflaeche.
      # In Produktion ist dieser Wert verboten - die Anwendung startet dann nicht.
      ELEKTROPLAN_INVITATION_DELIVERY: development_link
      # Passwortzuruecksetzung (Phase 4e): Ohne E-Mail-Versand erhaelt der
      # ausloesende Administrator den Einmal-Link genau einmal. In Produktion
      # verboten - die Anwendung startet dann nicht.
      ELEKTROPLAN_PASSWORD_RESET_DELIVERY: admin_link
      ELEKTROPLAN_PUBLIC_APP_URL: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Nur die Anwendung neu laden - die Umgebung liegt unter /opt/venv und
      # wird von diesem Mount nicht verdeckt.
      - ./apps/backend/app:/app/app:ro
      - ./apps/backend/migrations:/app/migrations:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  planner:
    build:
      context: .
      dockerfile: infrastructure/planner.Dockerfile
    container_name: elektroplan-planner
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Wird im Browser ausgewertet, nicht im Container - daher localhost.
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/planner/src:/workspace/apps/planner/src:ro
      # Der generierte API-Client gehoert zum Quellstand des Planners. Ohne
      # diese Einbindung liefe der Dev-Server gegen die Fassung aus dem Image
      # und wuerde neue Client-Funktionen stillschweigend ignorieren.
      - ./packages/api-client/src:/workspace/packages/api-client/src:ro

volumes:
  postgres-data:
  minio-data:
