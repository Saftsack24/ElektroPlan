# Entwicklungsumgebung. Start mit:  docker compose up
# Produktionsbetrieb erfordert eine eigene Compose-Datei (Secrets, TLS, Backups).
#
# Images sind auf Digests gepinnt (Punkt 1 der Phase-1.1-Abnahme). Ein Update
# erfolgt bewusst durch Austausch des Digests, nicht durch einen beweglichen Tag.
# MinIO wird von quay.io bezogen - auf Docker Hub existiert `minio/minio` nicht mehr.

services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    container_name: elektroplan-postgres
    environment:
      POSTGRES_USER: elektroplan
      POSTGRES_PASSWORD: elektroplan
      POSTGRES_DB: elektroplan
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h/-p erzwingen eine echte TCP-Verbindung; waehrend der Initialisierung
      # startet PostgreSQL kurzzeitig nur auf dem Unix-Socket.
      test: ["CMD-SHELL", "pg_isready -U elektroplan -d elektroplan -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: elektroplan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: elektroplan
      MINIO_ROOT_PASSWORD: elektroplan-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Dokumentierter Liveness-Endpunkt, im Image liegt curl unter /usr/bin/curl.
      # Bewusst ohne `mc`-Alias: Der Healthcheck darf von nichts abhaengen, das
      # erst ein nachgelagerter Container anlegt.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: elektroplan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/elektroplan
        mc anonymous set none local/elektroplan
        echo "Bucket 'elektroplan' bereit, anonymer Zugriff deaktiviert."
    environment:
      MINIO_ROOT_USER: elektroplan
      MINIO_ROOT_PASSWORD: elektroplan-dev-secret
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend.Dockerfile
    container_name: elektroplan-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ELEKTROPLAN_ENVIRONMENT: development
      ELEKTROPLAN_DEBUG: "true"
      ELEKTROPLAN_DATABASE_URL: postgresql+psycopg://elektroplan:elektroplan@postgres:5432/elektroplan
      # Interner Endpunkt: Backend -> MinIO im Docker-Netz.
      ELEKTROPLAN_S3_ENDPOINT_URL: http://minio:9000
      # Oeffentlicher Endpunkt: signierte URLs, die der Browser aufruft.
      # Muss vom Host aus aufloesbar sein - "minio" ist es nicht.
      ELEKTROPLAN_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      ELEKTROPLAN_S3_ACCESS_KEY: elektroplan
      ELEKTROPLAN_S3_SECRET_KEY: elektroplan-dev-secret
      ELEKTROPLAN_S3_BUCKET: elektroplan
      ELEKTROPLAN_CORS_ORIGINS: http://localhost:5173
      ELEKTROPLAN_SEED_ADMIN_PASSWORD: entwicklung-bitte-aendern
    ports:
      - "8000:8000"
    volumes:
      # Nur die Anwendung neu laden - die Umgebung liegt unter /opt/venv und
      # wird von diesem Mount nicht verdeckt.
      - ./apps/backend/app:/app/app:ro
      - ./apps/backend/migrations:/app/migrations:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  planner:
    build:
      context: .
      dockerfile: infrastructure/planner.Dockerfile
    container_name: elektroplan-planner
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Wird im Browser ausgewertet, nicht im Container - daher localhost.
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/planner/src:/workspace/apps/planner/src:ro

volumes:
  postgres-data:
  minio-data:
