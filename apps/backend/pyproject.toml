[project]
name = "elektroplan-backend"
version = "0.1.0"
description = "ElektroPlan Backend - modularer Monolith auf FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "structlog>=24.4",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    # uv steht bewusst im Lock: Sonst wuerde `uv sync` das Werkzeug aus der
    # Umgebung entfernen, mit dem es gerade aufgerufen wurde.
    "uv==0.12.17",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "S", "DTZ"]
ignore = [
    "ANN401",  # Any ist in eng begrenzten Faellen noetig
    "B008",    # FastAPI Depends() im Default ist idiomatisch
    "S101",    # assert in Tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S105", "S106", "S311"]
"migrations/*" = ["ANN", "N999", "E501"]
"app/core/seed.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "database: benoetigt eine laufende PostgreSQL-Instanz (ELEKTROPLAN_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
